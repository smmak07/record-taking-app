<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বাকি খাতা</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f4;--card:#fff;--tx:#1b2420;--mut:#6b7670;--pri:#0f7a4f;--red:#c62f2f;--bd:#e2e6e3}
:root[data-theme="dark"]{--bg:#121714;--card:#1c2420;--tx:#eaf0ec;--mut:#98a59d;--pri:#3ecf8e;--red:#ff6b6b;--bd:#2c3631}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121714;--card:#1c2420;--tx:#eaf0ec;--mut:#98a59d;--pri:#3ecf8e;--red:#ff6b6b;--bd:#2c3631}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;font-size:16px}
.app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:22px}
.red{color:var(--red)}.grn{color:var(--pri)}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cust{cursor:pointer}.cust b{display:block}.cust small{color:var(--mut)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:30px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tx{border-bottom:1px solid var(--bd);padding:10px 0}.tx:last-child{border:0}
.tx small{color:var(--mut)}
.actions{display:flex;gap:8px;margin:10px 0}.actions button{flex:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.back{background:none;color:var(--pri);padding:6px 0}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
let D={customers:[]},view=null,sheet=null,q="";
try{const s=localStorage.getItem("baki-v1");if(s)D=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem("baki-v1",JSON.stringify(D))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=x=>"৳"+Number(x).toLocaleString("bn-BD");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bal=c=>c.tx.reduce((s,t)=>s+(t.type==="baki"?t.amt:-t.amt),0);
const dt=t=>new Date(t).toLocaleDateString("bn-BD",{day:"numeric",month:"short"});
const cust=()=>D.customers.find(c=>c.id===view);

function render(){
  $("app").innerHTML=(view&&cust()?detail():home())+(sheet?sheetHtml():"");
}
function home(){
  const tot=D.customers.reduce((s,c)=>s+Math.max(bal(c),0),0);
  const owing=D.customers.filter(c=>bal(c)>0).length;
  const list=D.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||(c.phone||"").includes(q))
    .sort((a,b)=>bal(b)-bal(a));
  return `<h1>📒 বাকি খাতা</h1>
  <div class="stats"><div class="card stat"><small>মোট বাকি</small><b class="red">${n(tot)}</b></div>
  <div class="card stat"><small>বাকি আছে এমন কাস্টমার</small><b>${owing.toLocaleString("bn-BD")} জন</b></div></div>
  <input id="q" placeholder="🔍 নাম বা ফোন দিয়ে খুঁজুন" value="${esc(q)}" oninput="q=this.value;render();$('q').focus();$('q').setSelectionRange(q.length,q.length)">
  ${list.length?list.map(c=>`<div class="card cust row" onclick="view='${c.id}';render()">
    <div><b>${esc(c.name)}</b><small>${esc(c.phone||"ফোন নেই")}</small></div>
    <b class="${bal(c)>0?"red":"grn"}">${n(bal(c))}</b></div>`).join(""):`<div class="empty">কোনো কাস্টমার নেই।<br>নিচের বাটনে চাপ দিয়ে যোগ করুন।</div>`}
  <button class="fab" onclick="sheet={t:'cust'};render()">＋ নতুন কাস্টমার</button>`;
}
function detail(){
  const c=cust(),b=bal(c);
  return `<button class="back" onclick="view=null;render()">← ফিরে যান</button>
  <div class="card"><div class="row"><div><h1 style="margin:0">${esc(c.name)}</h1><small style="color:var(--mut)">${esc(c.phone||"")}</small></div>
  <div style="text-align:right"><small style="color:var(--mut)">${b>0?"বাকি":"অগ্রিম/পরিশোধ"}</small><br><b style="font-size:24px" class="${b>0?"red":"grn"}">${n(Math.abs(b))}</b></div></div>
  <div class="actions"><button onclick="sheet={t:'baki'};render()">＋ বাকি</button><button class="sec" onclick="sheet={t:'joma'};render()">＋ জমা</button></div>
  ${c.phone&&b>0?`<button class="sec" style="width:100%" onclick="remind()">📲 WhatsApp এ তাগাদা পাঠান</button>`:""}</div>
  <div class="card">${c.tx.length?[...c.tx].reverse().map(t=>`<div class="tx row"><div>
    <b>${t.type==="baki"?esc(t.item)+(t.qty>1?" × "+t.qty.toLocaleString("bn-BD"):""):"জমা"}</b><br><small>${dt(t.date)}</small></div>
    <div style="text-align:right"><b class="${t.type==="baki"?"red":"grn"}">${t.type==="baki"?"+":"−"}${n(t.amt)}</b><br>
    <small style="cursor:pointer" onclick="delTx('${t.id}')">মুছুন</small></div></div>`).join(""):`<div class="empty">কোনো লেনদেন নেই</div>`}</div>
  <button class="danger" onclick="delCust()">এই কাস্টমার মুছুন</button>`;
}
function sheetHtml(){
  const t=sheet.t;
  const f={
    cust:`<h1>নতুন কাস্টমার</h1><input id="f1" placeholder="নাম" autofocus><input id="f2" type="tel" placeholder="ফোন নম্বর (01XXXXXXXXX)">`,
    baki:`<h1>বাকি যোগ করুন</h1><input id="f1" placeholder="পণ্যের নাম" autofocus><input id="f2" type="number" inputmode="decimal" placeholder="পরিমাণ" value="1"><input id="f3" type="number" inputmode="decimal" placeholder="একক দাম (৳)">`,
    joma:`<h1>জমা নিন</h1><input id="f1" type="number" inputmode="decimal" placeholder="টাকার পরিমাণ" autofocus>`}[t];
  return `<div class="sheet" onclick="if(event.target===this){sheet=null;render()}"><div>${f}
  <div class="actions"><button class="sec" onclick="sheet=null;render()">বাতিল</button><button onclick="submit()">সংরক্ষণ</button></div></div></div>`;
}
function submit(){
  const v=i=>($("f"+i)||{}).value||"";const t=sheet.t;
  if(t==="cust"){if(!v(1).trim())return;D.customers.push({id:uid(),name:v(1).trim(),phone:v(2).trim(),tx:[]})}
  else{
    const c=cust();
    if(t==="baki"){const qty=parseFloat(v(2))||1,p=parseFloat(v(3));if(!v(1).trim()||!p)return;
      c.tx.push({id:uid(),type:"baki",item:v(1).trim(),qty,price:p,amt:qty*p,date:Date.now()})}
    else{const a=parseFloat(v(1));if(!a)return;c.tx.push({id:uid(),type:"joma",amt:a,date:Date.now()})}
  }
  sheet=null;save();render();
}
function delTx(id){if(!confirm("এই এন্ট্রি মুছবেন?"))return;const c=cust();c.tx=c.tx.filter(t=>t.id!==id);save();render()}
function delCust(){if(!confirm("কাস্টমার ও সব হিসাব মুছে যাবে। নিশ্চিত?"))return;D.customers=D.customers.filter(c=>c.id!==view);view=null;save();render()}
function remind(){
  const c=cust();let p=c.phone.replace(/\D/g,"");if(p.startsWith("0"))p="88"+p;
  const m=`আসসালামু আলাইকুম ${c.name}, আপনার বাকি ${bal(c)} টাকা। সুবিধামতো পরিশোধ করার অনুরোধ রইল। ধন্যবাদ।`;
  window.open("https://wa.me/"+p+"?text="+encodeURIComponent(m),"_blank");
}
render();
</script>
</body>
</html>
